name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build (VSCode + Zed)
        run: npm run build

      - name: Validate Zed JSON against v0.2.0 schema
        run: npm run validate

      - name: APCA contrast check
        run: npm run check:contrast

      # Split-brain gate: the committed dist/, themes/, and extension.toml must
      # match what the source just built — Zed's registry serves the committed
      # files while the .vsix ships a fresh build. Placed AFTER the contrast
      # step because check:contrast is the only writer of dist/apca-report.txt.
      # Keep in sync with the release gates (.github/workflows/release.yml).
      - name: Committed artifacts match source
        run: npm run check:drift

      - name: Tests
        run: npm test
